[app]
name = "raccoon-sync"

[database.read]
type = "sqlite"

# [database.read]
# type = "postgresql"
# url = "postgres://raccoon:raccoon@read-postgres:5432/raccoon"

[database.write]
type = "sqlite"

# [database.write]
# type = "postgresql"
# url = "postgres://raccoon:raccoon@write-postgres:5432/raccoon"

[filesystem]
root = "data"

[grpc]
bind_address = "127.0.0.1:50055"

[runtime]
shutdown_timeout_seconds = 30
force_exit_on_timeout = false

[storage]
backend = "filesystem"

[telemetry]
log_level = "info"
log_format = "json"

[telemetry.tracing]
enabled = false

[telemetry.tracing.exporter]
endpoint = "http://127.0.0.1:4317"
protocol = "grpc"
timeout_seconds = 10

[telemetry.metrics]
enabled = false
export_interval_seconds = 30

[telemetry.metrics.exporter]
endpoint = "http://127.0.0.1:4317"
protocol = "grpc"
timeout_seconds = 10
