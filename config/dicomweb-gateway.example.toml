[app]
name = "raccoon-dicomweb-gateway"

[dcmtk]
# path = "/usr/local/bin"

[dicomweb]
bind_address = "127.0.0.1:8081"
base_path = "/dicom-web"

[dicomweb.render_cache]
enabled = true
directory = "data/dicomweb-render-cache"
ttl_seconds = 86400
max_bytes = 536870912
default_rendered_media_type = "image/jpeg"

[filesystem]
root = "data"

[ingest]
endpoint = "http://127.0.0.1:50053"

[query]
endpoint = "http://127.0.0.1:50052"

[retrieve]
endpoint = "http://127.0.0.1:50054"

[runtime]
shutdown_timeout_seconds = 30
force_exit_on_timeout = false

[telemetry]
log_level = "info"
log_format = "json"

[telemetry.tracing]
enabled = false

[telemetry.tracing.exporter]
endpoint = "http://127.0.0.1:4317"
protocol = "grpc"
timeout_seconds = 10

[telemetry.metrics]
enabled = false
export_interval_seconds = 30

[telemetry.metrics.exporter]
endpoint = "http://127.0.0.1:4317"
protocol = "grpc"
timeout_seconds = 10
