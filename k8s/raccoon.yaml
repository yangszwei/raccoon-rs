apiVersion: v1
kind: Namespace
metadata:
  name: raccoon
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: raccoon-common-env
  namespace: raccoon
data:
  RACCOON__GRPC__BIND_ADDRESS: 0.0.0.0:50051
  RACCOON__FILESYSTEM__ROOT: /data
  RACCOON__APPLICATION_ENTITY_REGISTRY__ENDPOINT: http://application-entity-registry:50051
  RACCOON__INGEST__ENDPOINT: http://ingest:50051
  RACCOON__QUERY__ENDPOINT: http://query:50051
  RACCOON__RETRIEVE__ENDPOINT: http://retrieve:50051
  RACCOON__TELEMETRY__TRACING__ENABLED: "true"
  RACCOON__TELEMETRY__TRACING__EXPORTER__ENDPOINT: http://otel-collector:4317
  RACCOON__TELEMETRY__TRACING__EXPORTER__PROTOCOL: grpc
  RACCOON__TELEMETRY__TRACING__EXPORTER__TIMEOUT_SECONDS: "10"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: raccoon
data:
  otel-collector-config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      batch: {}

    exporters:
      otlp/jaeger:
        endpoint: jaeger:4317
        tls:
          insecure: true

    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [otlp/jaeger]
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: raccoon
spec:
  selector:
    app.kubernetes.io/name: otel-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: raccoon
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: otel-collector
    spec:
      nodeSelector:
        kubernetes.io/hostname: worker
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.104.0
          imagePullPolicy: IfNotPresent
          args:
            - --config=/etc/otel-collector-config.yaml
          ports:
            - containerPort: 4317
              name: otlp-grpc
            - containerPort: 4318
              name: otlp-http
          readinessProbe:
            tcpSocket:
              port: 4317
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 20
          livenessProbe:
            tcpSocket:
              port: 4317
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          volumeMounts:
            - name: config
              mountPath: /etc/otel-collector-config.yaml
              subPath: otel-collector-config.yaml
      volumes:
        - name: config
          configMap:
            name: otel-collector-config
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: raccoon
spec:
  selector:
    app.kubernetes.io/name: jaeger
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: query
      port: 16686
      targetPort: 16686
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger-query
  namespace: raccoon
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: jaeger
  ports:
    - name: query
      port: 16686
      targetPort: 16686
      nodePort: 31686
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: raccoon
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: jaeger
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jaeger
    spec:
      nodeSelector:
        kubernetes.io/hostname: worker
      initContainers:
        - name: prepare-badger
          image: busybox:1.36
          command:
            - sh
            - -c
            - mkdir -p /badger/data /badger/key && chown -R 10001:10001 /badger
          volumeMounts:
            - name: badger
              mountPath: /badger
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.57
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4317
              name: otlp-grpc
            - containerPort: 16686
              name: query
          env:
            - name: COLLECTOR_OTLP_ENABLED
              value: "true"
            - name: SPAN_STORAGE_TYPE
              value: badger
            - name: BADGER_EPHEMERAL
              value: "false"
            - name: BADGER_DIRECTORY_VALUE
              value: /badger/data
            - name: BADGER_DIRECTORY_KEY
              value: /badger/key
          readinessProbe:
            httpGet:
              path: /
              port: 16686
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /
              port: 16686
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          volumeMounts:
            - name: badger
              mountPath: /badger
      volumes:
        - name: badger
          hostPath:
            path: /var/lib/raccoon/jaeger-badger
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: write-postgres
  namespace: raccoon
spec:
  selector:
    app.kubernetes.io/name: write-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: write-postgres
  namespace: raccoon
spec:
  serviceName: write-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: write-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: write-postgres
    spec:
      nodeSelector:
        kubernetes.io/hostname: worker
      containers:
        - name: postgres
          image: postgres:17-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              value: raccoon
            - name: POSTGRES_USER
              value: raccoon
            - name: POSTGRES_PASSWORD
              value: raccoon
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - raccoon
                - -d
                - raccoon
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 20
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - raccoon
                - -d
                - raccoon
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          hostPath:
            path: /var/lib/raccoon/write-postgres
            type: DirectoryOrCreate
