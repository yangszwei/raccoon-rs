              command:
                - grpc-healthcheck
                - http://127.0.0.1:50051
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          volumeMounts:
            - name: objects
              mountPath: /data/objects
      volumes:
        - name: objects
          hostPath:
            path: /var/lib/raccoon/objects
