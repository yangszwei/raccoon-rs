  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dicomweb-gateway
  namespace: raccoon
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dicomweb-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dicomweb-gateway
    spec:
      nodeSelector:
        kubernetes.io/hostname: worker
      initContainers:
        - name: wait-for-read-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z read-postgres 5432; do sleep 2; done
        - name: wait-for-ingest
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z ingest 50051; do sleep 2; done
        - name: wait-for-query
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z query 50051; do sleep 2; done
        - name: wait-for-retrieve
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z retrieve 50051; do sleep 2; done
      containers:
        - name: dicomweb-gateway
          image: siweiyang/raccoon:dicomweb-gateway
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: raccoon-common-env
          env:
            - name: RACCOON_DICOMWEB_GATEWAY__DICOMWEB__BIND_ADDRESS
              value: 0.0.0.0:8080
            - name: RACCOON_DICOMWEB_GATEWAY__DICOMWEB__RENDER_CACHE__DIRECTORY
              value: /data/dicomweb-render-cache
            - name: RACCOON_DICOMWEB_GATEWAY__DCMTK__PATH
              value: /opt/dcmtk/bin
            - name: RACCOON_DICOMWEB_GATEWAY__DATABASE__TYPE
              value: postgresql
            - name: RACCOON_DICOMWEB_GATEWAY__DATABASE__URL
              value: postgres://raccoon:raccoon@read-postgres:5432/raccoon
            - name: RACCOON_DICOMWEB_GATEWAY__QUERY__ENDPOINT
              value: http://query:50051
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 20
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          volumeMounts:
            - name: render-cache
              mountPath: /data/dicomweb-render-cache
      volumes:
        - name: render-cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: c-move-destination
  namespace: raccoon
spec:
  selector:
    app.kubernetes.io/name: c-move-destination
  ports:
    - name: dimse
      port: 11113
      targetPort: 11113
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: c-move-destination
  namespace: raccoon
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: c-move-destination
  template:
    metadata:
      labels:
        app.kubernetes.io/name: c-move-destination
    spec:
      nodeSelector:
        kubernetes.io/hostname: worker
      containers:
        - name: storescp
          image: siweiyang/raccoon:dicomweb-gateway
          imagePullPolicy: IfNotPresent
          command:
            - /opt/dcmtk/bin/storescp
          args:
            - -v
            - -aet
            - RACCOON-MOVE
            - +uf
            - -od
            - /data/c-move-destination
            - "11113"
          ports:
            - containerPort: 11113
              name: dimse
          readinessProbe:
            tcpSocket:
              port: 11113
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 20
          livenessProbe:
            tcpSocket:
              port: 11113
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          volumeMounts:
            - name: c-move-output
              mountPath: /data/c-move-destination
      volumes:
        - name: c-move-output
          hostPath:
            path: /var/lib/raccoon/c-move-destination
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: dimse-gateway
  namespace: raccoon
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: dimse-gateway
  ports:
    - name: dimse
      port: 11112
      targetPort: 11112
      nodePort: 31112
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dimse-gateway
  namespace: raccoon
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dimse-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dimse-gateway
    spec:
      nodeSelector:
        kubernetes.io/hostname: worker
      initContainers:
        - name: wait-for-application-entity-registry
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z application-entity-registry 50051; do sleep 2; done
        - name: wait-for-ingest
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z ingest 50051; do sleep 2; done
        - name: wait-for-query
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z query 50051; do sleep 2; done
        - name: wait-for-retrieve
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z retrieve 50051; do sleep 2; done
      containers:
        - name: dimse-gateway
          image: siweiyang/raccoon:dimse-gateway
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 11112
              name: dimse
          envFrom:
            - configMapRef:
                name: raccoon-common-env
