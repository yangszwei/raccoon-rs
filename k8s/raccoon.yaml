apiVersion: apps/v1
kind: Deployment
metadata:
  name: application-entity-registry
  namespace: raccoon
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: application-entity-registry
  template:
    metadata:
      labels:
        app.kubernetes.io/name: application-entity-registry
    spec:
      nodeSelector:
        kubernetes.io/hostname: worker
      containers:
        - name: application-entity-registry
          image: siweiyang/raccoon:application-entity-registry
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 50051
              name: grpc
          envFrom:
            - configMapRef:
                name: raccoon-common-env
          env:
            - name: RACCOON_AE_REGISTRY__APPLICATION_ENTITIES__LOCAL__0__TITLE
              value: RACCOON
            - name: RACCOON_AE_REGISTRY__APPLICATION_ENTITIES__LOCAL__0__BIND_ADDRESS
              value: 0.0.0.0:11112
            - name: RACCOON_AE_REGISTRY__APPLICATION_ENTITIES__LOCAL__0__MAX_CONCURRENT_ASSOCIATIONS
              value: "64"
            - name: RACCOON_AE_REGISTRY__APPLICATION_ENTITIES__LOCAL__0__MAX_PDU_LENGTH
              value: "65536"
            - name: RACCOON_AE_REGISTRY__APPLICATION_ENTITIES__PEER__0__TITLE
              value: RACCOON-MOVE
            - name: RACCOON_AE_REGISTRY__APPLICATION_ENTITIES__PEER__0__ADDRESS
              value: c-move-destination:11113
            - name: RACCOON_AE_REGISTRY__APPLICATION_ENTITIES__PEER__0__CONNECT_TIMEOUT_SECONDS
              value: "5"
            - name: RACCOON_AE_REGISTRY__APPLICATION_ENTITIES__PEER__0__READ_TIMEOUT_SECONDS
              value: "30"
            - name: RACCOON_AE_REGISTRY__APPLICATION_ENTITIES__PEER__0__WRITE_TIMEOUT_SECONDS
              value: "30"
            - name: RACCOON_AE_REGISTRY__APPLICATION_ENTITIES__PEER__0__MAX_PDU_LENGTH
              value: "65536"
          readinessProbe:
            exec:
              command:
                - grpc-healthcheck
                - http://127.0.0.1:50051
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 20
          livenessProbe:
            exec:
              command:
                - grpc-healthcheck
                - http://127.0.0.1:50051
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
