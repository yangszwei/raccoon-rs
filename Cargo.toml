[workspace]
resolver = "3"
members = ["apps/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

# Flag overly complex control flow.
cognitive_complexity = "warn"

# Flag temporary or incomplete code.
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

# Flag common panic paths.
expect_used = "warn"
indexing_slicing = "warn"
panic = "warn"
unwrap_used = "warn"

# Require unsafe blocks to document their safety invariants.
undocumented_unsafe_blocks = "warn"
