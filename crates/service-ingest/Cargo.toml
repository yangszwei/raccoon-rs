[package]
name = "raccoon-service-ingest"
version.workspace = true
edition.workspace = true
build = "build.rs"

[features]
grpc = [
    "dep:opentelemetry",
    "dep:prost",
    "dep:protoc-bin-vendored",
    "dep:tokio-stream",
    "dep:tonic",
    "dep:tonic-prost",
    "dep:tonic-prost-build",
    "dep:tracing-opentelemetry",
]

[dependencies]
async-trait = "0.1.89"
dicom-dictionary-std = "0.9.0"
dicom-object = "0.9.1"
futures-util = "0.3.32"
opentelemetry = { workspace = true, optional = true }
raccoon-contract-object-store = { path = "../contract-object-store" }
sha2 = "0.11.0"
thiserror = "2.0.18"
tokio-stream = { version = "0.1.17", features = ["net", "sync"], optional = true }
tokio = { version = "1.52.3", features = ["fs", "io-util", "rt", "sync"] }
tokio-util = { version = "0.7.18", features = ["io"] }
tonic = { version = "0.14.6", optional = true }
tonic-prost = { version = "0.14.6", optional = true }
tracing.workspace = true
tracing-opentelemetry = { version = "0.32.1", optional = true }
uuid = { version = "1.23.1", default-features = false, features = ["std", "v7"] }
prost = { version = "0.14.3", optional = true }

[build-dependencies]
protoc-bin-vendored = { version = "3.2.0", optional = true }
tonic-prost-build = { version = "=0.14.6", optional = true }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.52.3", features = ["macros", "rt"] }
