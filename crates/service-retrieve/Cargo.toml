[package]
name = "raccoon-service-retrieve"
version.workspace = true
edition.workspace = true
build = "build.rs"

[features]
grpc = [
    "dep:opentelemetry",
    "dep:prost",
    "dep:protoc-bin-vendored",
    "dep:tokio",
    "dep:tokio-stream",
    "dep:tonic",
    "dep:tonic-prost",
    "dep:tonic-prost-build",
    "dep:tracing-opentelemetry",
]

[dependencies]
async-trait = "0.1.89"
futures-util = "0.3.32"
opentelemetry = { workspace = true, optional = true }
prost = { version = "0.14.3", optional = true }
raccoon-contract-dicom = { path = "../contract-dicom" }
raccoon-contract-object-store = { path = "../contract-object-store" }
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["rt", "sync"], optional = true }
tokio-stream = { version = "0.1.17", features = ["sync"], optional = true }
tonic = { version = "0.14.6", optional = true }
tonic-prost = { version = "0.14.6", optional = true }
tracing.workspace = true
tracing-opentelemetry = { version = "0.32.1", optional = true }

[build-dependencies]
protoc-bin-vendored = { version = "3.2.0", optional = true }
tonic-prost-build = { version = "=0.14.6", optional = true }

[dev-dependencies]
tokio = { version = "1.52.3", features = ["macros", "rt"] }
