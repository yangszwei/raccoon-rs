[package]
name = "raccoon-adapter-read-postgres"
version.workspace = true
edition.workspace = true

[dependencies]
async-trait = "0.1.89"
dicom-core = "0.9.1"
dicom-dictionary-std = "0.9.0"
dicom-json = "0.9.0"
dicom-object = "0.9.1"
raccoon-contract-dicom = { path = "../contract-dicom" }
raccoon-contract-object-store = { path = "../contract-object-store" }
raccoon-service-query = { path = "../service-query" }
raccoon-service-retrieve = { path = "../service-retrieve" }
raccoon-service-sync = { path = "../service-sync" }
serde_json = "1.0"
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "migrate", "macros", "json"] }
thiserror = "2.0.18"
tracing.workspace = true

[dev-dependencies]
tokio = { version = "1.52.3", features = ["macros", "rt"] }
