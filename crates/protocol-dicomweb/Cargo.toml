[package]
name = "raccoon-protocol-dicomweb"
version.workspace = true
edition.workspace = true

[dependencies]
axum = "0.8.9"
base64 = "0.22.1"
dicom-core = "0.9.1"
dicom-dictionary-std = "0.9.0"
dicom-json = "0.9.0"
dicom-object = "0.9.1"
form_urlencoded = "1.2.2"
futures-util = "0.3.31"
multer = "3.1.0"
raccoon-contract-object-store = { path = "../contract-object-store" }
raccoon-contract-dicom = { path = "../contract-dicom" }
raccoon-service-ingest = { path = "../service-ingest" }
raccoon-service-query = { path = "../service-query" }
raccoon-service-retrieve = { path = "../service-retrieve" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["fs", "io-util"] }
tokio-util = { version = "0.7.17", features = ["io"] }
tracing.workspace = true

[dev-dependencies]
async-trait = "0.1.89"
serde_json = "1.0"
tokio = { version = "1.52.3", features = ["macros", "rt", "time"] }
tower = { version = "0.5.3", features = ["util"] }
tracing-subscriber = "0.3.23"
