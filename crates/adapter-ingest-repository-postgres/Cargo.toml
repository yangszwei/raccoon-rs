[package]
name = "raccoon-adapter-ingest-repository-postgres"
version.workspace = true
edition.workspace = true

[dependencies]
async-trait = "0.1.89"
raccoon-contract-object-store = { path = "../contract-object-store" }
raccoon-service-ingest = { path = "../service-ingest" }
raccoon-service-sync = { path = "../service-sync" }
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "migrate", "macros", "uuid"] }
thiserror = "2.0.18"
tracing.workspace = true
uuid = { version = "1.23.2", default-features = false, features = ["std"] }

[dev-dependencies]
tokio = { version = "1.52.3", features = ["macros", "rt"] }
uuid = "1.23.2"
