[package]
name = "raccoon-platform-orchestration"
version.workspace = true
edition.workspace = true

[features]
default = []
grpc = [
    "dep:tonic",
    "dep:tokio-stream",
    "raccoon-service-application-entity-registry/grpc",
    "raccoon-service-ingest/grpc",
    "raccoon-service-query/grpc",
    "raccoon-service-retrieve/grpc",
    "raccoon-service-sync/grpc",
    "tokio/net",
    "tokio/sync",
]

[dependencies]
raccoon-adapter-ingest-repository-sqlite = { path = "../adapter-ingest-repository-sqlite" }
raccoon-adapter-object-store-filesystem = { path = "../adapter-object-store-filesystem" }
raccoon-adapter-read-sqlite = { path = "../adapter-read-sqlite" }
raccoon-contract-object-store = { path = "../contract-object-store" }
raccoon-platform-config = { path = "../platform-config" }
raccoon-platform-runtime = { path = "../platform-runtime" }
raccoon-platform-telemetry = { path = "../platform-telemetry" }
raccoon-protocol-dimse = { path = "../protocol-dimse" }
raccoon-service-application-entity-registry = { path = "../service-application-entity-registry" }
raccoon-service-ingest = { path = "../service-ingest" }
raccoon-service-query = { path = "../service-query" }
raccoon-service-retrieve = { path = "../service-retrieve" }
raccoon-service-sync = { path = "../service-sync" }
thiserror = "2.0.18"
tokio = { version = "1.52.1", features = ["fs", "rt", "signal", "sync"] }
tokio-stream = { version = "0.1.17", features = ["net"], optional = true }
tokio-util = { version = "0.7.18", features = ["rt"] }
tonic = { version = "0.14.6", optional = true }
tracing.workspace = true

[dev-dependencies]
tempfile = "3.23.0"
