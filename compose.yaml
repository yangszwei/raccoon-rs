name: raccoon

x-raccoon-grpc-environment: &raccoon-grpc-environment
  RACCOON__GRPC__BIND_ADDRESS: 0.0.0.0:50051

x-raccoon-data-environment: &raccoon-data-environment
  RACCOON__FILESYSTEM__ROOT: /data

x-raccoon-write-database-environment: &raccoon-write-database-environment
  RACCOON__DATABASE__TYPE: postgresql
  RACCOON__DATABASE__URL: postgres://raccoon:raccoon@write-postgres:5432/raccoon

x-raccoon-read-database-environment: &raccoon-read-database-environment
  RACCOON__DATABASE__TYPE: postgresql
  RACCOON__DATABASE__URL: postgres://raccoon:raccoon@read-postgres:5432/raccoon

x-raccoon-service-endpoint-environment: &raccoon-service-endpoint-environment
  RACCOON__APPLICATION_ENTITY_REGISTRY__ENDPOINT: http://application-entity-registry:50051
  RACCOON__INGEST__ENDPOINT: http://ingest:50051
  RACCOON__QUERY__ENDPOINT: http://query:50051
  RACCOON__RETRIEVE__ENDPOINT: http://retrieve:50051

services:
  write-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: raccoon
      POSTGRES_USER: raccoon
      POSTGRES_PASSWORD: raccoon
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U raccoon -d raccoon" ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    volumes:
      - write-postgres-data:/var/lib/postgresql/data

  read-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: raccoon
      POSTGRES_USER: raccoon
      POSTGRES_PASSWORD: raccoon
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U raccoon -d raccoon" ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    volumes:
      - read-postgres-data:/var/lib/postgresql/data

  dicomweb-gateway:
    image: raccoon-dicomweb-gateway:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PACKAGE: raccoon-dicomweb-gateway
    depends_on:
      read-postgres:
        condition: service_healthy
      ingest:
        condition: service_healthy
      query:
        condition: service_healthy
      retrieve:
        condition: service_healthy
    environment:
      <<: [ *raccoon-data-environment, *raccoon-read-database-environment, *raccoon-service-endpoint-environment ]
      RACCOON_DICOMWEB_GATEWAY__DICOMWEB__BIND_ADDRESS: 0.0.0.0:8080
      RACCOON_DICOMWEB_GATEWAY__DICOMWEB__RENDER_CACHE__DIRECTORY: /data/dicomweb-render-cache
    ports:
      - "8080:8080"
    volumes:
      - dicomweb-render-cache:/data/dicomweb-render-cache

  dimse-gateway:
    image: raccoon-dimse-gateway:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PACKAGE: raccoon-dimse-gateway
    depends_on:
      application-entity-registry:
        condition: service_healthy
      ingest:
        condition: service_healthy
      query:
        condition: service_healthy
      retrieve:
        condition: service_healthy
    environment:
      <<: *raccoon-service-endpoint-environment
    ports:
      - "11112:11112"

  application-entity-registry:
    image: raccoon-application-entity-registry:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PACKAGE: raccoon-application-entity-registry
    environment:
      <<: *raccoon-grpc-environment
      RACCOON_AE_REGISTRY__APPLICATION_ENTITIES__LOCAL__0__TITLE: RACCOON
      RACCOON_AE_REGISTRY__APPLICATION_ENTITIES__LOCAL__0__BIND_ADDRESS: 0.0.0.0:11112
      RACCOON_AE_REGISTRY__APPLICATION_ENTITIES__LOCAL__0__MAX_CONCURRENT_ASSOCIATIONS: 64
      RACCOON_AE_REGISTRY__APPLICATION_ENTITIES__LOCAL__0__MAX_PDU_LENGTH: 65536
    healthcheck:
      test: [ "CMD", "grpc-healthcheck", "http://127.0.0.1:50051" ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 3s

  ingest:
    image: raccoon-ingest:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PACKAGE: raccoon-ingest
    depends_on:
      write-postgres:
        condition: service_healthy
    environment:
      <<: [ *raccoon-grpc-environment, *raccoon-data-environment, *raccoon-write-database-environment ]
    healthcheck:
      test: [ "CMD", "grpc-healthcheck", "http://127.0.0.1:50051" ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 3s
    volumes:
      - objects:/data/objects

  query:
    image: raccoon-query:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PACKAGE: raccoon-query
    depends_on:
      read-postgres:
        condition: service_healthy
    environment:
      <<: [ *raccoon-grpc-environment, *raccoon-data-environment, *raccoon-read-database-environment ]
    healthcheck:
      test: [ "CMD", "grpc-healthcheck", "http://127.0.0.1:50051" ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 3s

  retrieve:
    image: raccoon-retrieve:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PACKAGE: raccoon-retrieve
    depends_on:
      read-postgres:
        condition: service_healthy
    environment:
      <<: [ *raccoon-grpc-environment, *raccoon-data-environment, *raccoon-read-database-environment ]
    healthcheck:
      test: [ "CMD", "grpc-healthcheck", "http://127.0.0.1:50051" ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 3s
    volumes:
      - objects:/data/objects

  sync:
    image: raccoon-sync:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PACKAGE: raccoon-sync
    depends_on:
      write-postgres:
        condition: service_healthy
      read-postgres:
        condition: service_healthy
    environment:
      <<: [ *raccoon-grpc-environment, *raccoon-data-environment ]
      RACCOON_SYNC__DATABASE__WRITE__TYPE: postgresql
      RACCOON_SYNC__DATABASE__WRITE__URL: postgres://raccoon:raccoon@write-postgres:5432/raccoon
      RACCOON_SYNC__DATABASE__READ__TYPE: postgresql
      RACCOON_SYNC__DATABASE__READ__URL: postgres://raccoon:raccoon@read-postgres:5432/raccoon
    healthcheck:
      test: [ "CMD", "grpc-healthcheck", "http://127.0.0.1:50051" ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 3s
    volumes:
      - objects:/data/objects

volumes:
  dicomweb-render-cache:
  objects:
  read-postgres-data:
  write-postgres-data:
