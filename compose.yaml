name: raccoon

x-raccoon-grpc-environment: &raccoon-grpc-environment
  RACCOON__GRPC__BIND_ADDRESS: 0.0.0.0:50051

x-raccoon-data-environment: &raccoon-data-environment
  RACCOON__FILESYSTEM__ROOT: /data

x-raccoon-service-endpoint-environment: &raccoon-service-endpoint-environment
  RACCOON__APPLICATION_ENTITY_REGISTRY__ENDPOINT: http://application-entity-registry:50051
  RACCOON__INGEST__ENDPOINT: http://ingest:50051
  RACCOON__QUERY__ENDPOINT: http://query:50051
  RACCOON__RETRIEVE__ENDPOINT: http://retrieve:50051

services:
  dicomweb-gateway:
    image: raccoon-dicomweb-gateway:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PACKAGE: raccoon-dicomweb-gateway
    depends_on:
      ingest:
        condition: service_healthy
      query:
        condition: service_healthy
      retrieve:
        condition: service_healthy
    environment:
      <<: [ *raccoon-data-environment, *raccoon-service-endpoint-environment ]
      RACCOON_DICOMWEB_GATEWAY__DICOMWEB__BIND_ADDRESS: 0.0.0.0:8080
      RACCOON_DICOMWEB_GATEWAY__DICOMWEB__RENDER_CACHE__DIRECTORY: /data/dicomweb-render-cache
    ports:
      - "8080:8080"
    volumes:
      - read-db:/data/read
      - dicomweb-render-cache:/data/dicomweb-render-cache

  dimse-gateway:
    image: raccoon-dimse-gateway:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PACKAGE: raccoon-dimse-gateway
    depends_on:
      application-entity-registry:
        condition: service_healthy
      ingest:
        condition: service_healthy
      query:
        condition: service_healthy
      retrieve:
        condition: service_healthy
    environment:
      <<: *raccoon-service-endpoint-environment
    ports:
      - "11112:11112"

  application-entity-registry:
    image: raccoon-application-entity-registry:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PACKAGE: raccoon-application-entity-registry
    environment:
      <<: *raccoon-grpc-environment
      RACCOON_AE_REGISTRY__APPLICATION_ENTITIES__LOCAL__0__TITLE: RACCOON
      RACCOON_AE_REGISTRY__APPLICATION_ENTITIES__LOCAL__0__BIND_ADDRESS: 0.0.0.0:11112
      RACCOON_AE_REGISTRY__APPLICATION_ENTITIES__LOCAL__0__MAX_CONCURRENT_ASSOCIATIONS: 64
      RACCOON_AE_REGISTRY__APPLICATION_ENTITIES__LOCAL__0__MAX_PDU_LENGTH: 65536
    healthcheck:
      test: [ "CMD", "grpc-healthcheck", "http://127.0.0.1:50051" ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 3s

  ingest:
    image: raccoon-ingest:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PACKAGE: raccoon-ingest
    environment:
      <<: [ *raccoon-grpc-environment, *raccoon-data-environment ]
    healthcheck:
      test: [ "CMD", "grpc-healthcheck", "http://127.0.0.1:50051" ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 3s
    volumes:
      - ingest-db:/data/ingest
      - objects:/data/objects

  query:
    image: raccoon-query:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PACKAGE: raccoon-query
    environment:
      <<: [ *raccoon-grpc-environment, *raccoon-data-environment ]
    healthcheck:
      test: [ "CMD", "grpc-healthcheck", "http://127.0.0.1:50051" ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 3s
    volumes:
      - read-db:/data/read

  retrieve:
    image: raccoon-retrieve:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PACKAGE: raccoon-retrieve
    environment:
      <<: [ *raccoon-grpc-environment, *raccoon-data-environment ]
    healthcheck:
      test: [ "CMD", "grpc-healthcheck", "http://127.0.0.1:50051" ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 3s
    volumes:
      - read-db:/data/read
      - objects:/data/objects

  sync:
    image: raccoon-sync:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PACKAGE: raccoon-sync
    environment:
      <<: [ *raccoon-grpc-environment, *raccoon-data-environment ]
    healthcheck:
      test: [ "CMD", "grpc-healthcheck", "http://127.0.0.1:50051" ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 3s
    volumes:
      - ingest-db:/data/ingest
      - read-db:/data/read
      - objects:/data/objects

volumes:
  dicomweb-render-cache:
  ingest-db:
  read-db:
  objects:
